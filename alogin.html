<!DOCTYPE html>
<html lang="id">

<head>

    $(if refresh-timeout)
    <meta http-equiv="refresh" content="$(refresh-timeout-secs)"> $(endif)
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- The above 3 meta tags *must* come first in the head; any other head content must come *after* these tags -->
    <meta name="description" content="">
    <meta name="author" content="">
    <title>WiFi BRITE | Berhasil Login</title>
    <link rel="icon" type="image/png" sizes="32x32" href="img/brite-favicon-32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="img/brite-favicon-48.png">
    <link rel="apple-touch-icon" href="img/brite-touch-icon.png">
    <link rel="stylesheet" href="css/style.css?v=3">

    <script language="JavaScript">
        <!--
        function startClock() {
            // Trial cuma untuk keperluan beli voucher -- kalau ada sesi trial
            // yang sampai ke halaman ini di luar alur beli-voucher kita,
            // langsung kembalikan ke login. Login biasa (voucher/mac) diarahkan
            // ke halaman status seperti biasa.
            $(if login-by == 'trial')
            location.href = '$(link-login)';
            $(else)
            location.href = '$(link-status)';
            $(endif)
        }
        //-->
    </script>

</head>

<body role="document" onLoad="startClock()">

    <div class="page page-center">
        <header class="site-header">
            <img src="img/brite-logo.png" alt="BRITE by Telkomsat" class="brand-logo">
        </header>

        <main class="page-main">
            <div class="center-block">
                <div class="success-icon" aria-hidden="true"></div>
                <h1 class="success-title">Anda berhasil login</h1>
                <p class="success-text">Internet siap digunakan. Mengalihkan otomatis&hellip;</p>
                <div class="progress-bar" aria-hidden="true"></div>
                <div class="success-actions">
                    <button type="button" class="btn btn-primary" onclick="$(if login-by == 'trial')location.href='$(link-login)'$(else)location.href='$(link-status)'$(endif)">Lanjutkan sekarang</button>
                </div>
            </div>
        </main>
    </div>

    <!-- Bootstrap core JavaScript
    ================================================== -->
    <!-- Placed at the end of the document so the pages load faster -->
    <script src="/js/jquery-1.12.2.min.js"></script>
    <script>
        window.jQuery || document.write('<script src="/js/jquery-1.12.2.min.js"><\/script>')
    </script>
</body>

</html>
