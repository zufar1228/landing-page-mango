<!DOCTYPE html>
<html lang="id">

<!-- Halaman masuk auto-login dari halaman invoice:
       tsat.zone/connect.html?voucher=KODE
     File statis (tanpa variabel MikroTik), jadi selalu dilayani router apa
     pun status login perangkatnya. Kode disimpan lalu diteruskan ke halaman
     login; logika ada di js/autologin.js. -->

<head>
    <meta charset="utf-8">
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>WiFi BRITE | Menyambungkan</title>
    <link rel="icon" type="image/webp" sizes="32x32" href="img/brite-favicon-32.webp">
    <link rel="icon" type="image/webp" sizes="48x48" href="img/brite-favicon-48.webp">
    <link rel="apple-touch-icon" href="img/brite-touch-icon.png">
    <link rel="stylesheet" href="css/fallback.css?v=1">
</head>

<body role="document">
    <div class="fb-page">
        <div class="fb-card">
            <img src="img/brite-logo.webp" alt="BRITE by Telkomsat" class="fb-logo" width="560" height="234">

            <h1 class="fb-title">Menyambungkan ke WiFi BRITE&hellip;</h1>
            <p class="fb-lead">Kode voucher Anda sedang diproses. Mohon tunggu sebentar.</p>
            <noscript>
                <p class="fb-lead">Halaman ini membutuhkan JavaScript.</p>
            </noscript>
            <span class="fb-spinner" aria-hidden="true"></span>
            <div class="fb-actions">
                <a href="/login" class="fb-btn fb-btn-tinted">Masuk manual</a>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="/js/autologin.js"></script>
    <script type="text/javascript">
        if (window.BriteAutoLogin) {
            BriteAutoLogin.startFromEntry();
        }
    </script>
</body>

</html>
