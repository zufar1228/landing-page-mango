<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- The above 3 meta tags *must* come first in the head; any other head content must come *after* these tags -->
    <meta name="description" content="">
    <meta name="author" content="">
    <title>WiFi BRITE | Logout</title>
    <link rel="icon" type="image/x-icon" href="img/hotspot.png">
    <link rel="stylesheet" href="css/style.css">

    <script language="JavaScript">
	<!--
	$(if advert-pending == 'yes')
	var popup = '';

	function focusAdvert() {
		if (window.focus) popup.focus();
	}

	function openAdvert() {
		popup = open('$(link-advert)', 'hotspot_advert', '');
		setTimeout("focusAdvert()", 1000);
	}
	$(endif)

	function byte_nice(bytes = 0) {
		var s = ['bytes', 'KB', 'MB', 'GB', 'TB', 'PB'];
		if(bytes == 0){
			return 0+" "+s[0];
		}
		var e = Math.floor(Math.log(bytes)/Math.log(1024));
		return (bytes/Math.pow(1024, Math.floor(e))).toFixed(2)+" "+s[e];
	}

	function bit_nice(bytes = 0) {
		var s = ['bit', 'Kb', 'Mb', 'Gb', 'Tb', 'Pb'];
		if(bytes == 0){
			return 0+" "+s[0];
		}
		var e = Math.floor(Math.log(bytes)/Math.log(1024));
		return (bytes/Math.pow(1024, Math.floor(e))).toFixed(2)+" "+s[e];
	}

	function secondsToTime(e){
		const h = Math.floor(e / 3600).toString().padStart(2,'0'),
			  m = Math.floor(e % 3600 / 60).toString().padStart(2,'0'),
			  s = Math.floor(e % 60).toString().padStart(2,'0');

		return h + ':' + m + ':' + s;
		//return `${h}:${m}:${s}`;
	}

	// MikroTik Hotspot bisa menyimpan cookie login (login-by "cookie") agar user
	// otomatis ter-autentikasi lagi tanpa masukin voucher. Setelah logout (manual
	// atau otomatis saat batal beli voucher), cookie ini harus dihapus supaya
	// sesi tidak tersambung sendiri lewat cookie yang masih tersisa.
	function clearHotspotCookies() {
		var cookies = document.cookie.split(';');
		for (var i = 0; i < cookies.length; i++) {
			var eqPos = cookies[i].indexOf('=');
			var name = (eqPos > -1 ? cookies[i].substr(0, eqPos) : cookies[i]).trim();
			if (!name) continue;
			document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/;';
		}
	}
	//-->
    </script>
</head>

<body role="document" onLoad="clearHotspotCookies(); location.href='$(link-login)'">
    <div class="page page-soft page-status">
        <main id="pageStatus" class="page-main">
            <div class="status-head">
                <img src="img/brite-logo.png" alt="BRITE by Telkomsat" class="brand-logo">
                <span class="pill pill-muted">Terputus</span>
            </div>

            <!-- <div class="status-caption">
                $(if login-by == 'trial')
                <br> Selamat Tinggal pengguna trial! <br>
                $(elif login-by != 'mac')
                <br> Selamat Tinggal $(username)! <br>
                $(endif)
            </div> -->

            <div class="logout-intro">
                <h1 class="page-title">Anda sudah logout</h1>
                <p class="page-lead">Sesi internet Anda telah diakhiri. Mengalihkan ke halaman login&hellip;</p>
            </div>

            <!-- Ringkasan sesi yang baru berakhir -->
            <div class="info-card">
                <div class="info-card-title">Ringkasan Sesi</div>
                <table class="info-table">
                    <tbody>
                        <tr>
                            <td>Alamat MAC</td>
                            <td>$(mac)</td>
                        </tr>
                        <tr>
                            <td>Alamat IP</td>
                            <td>$(ip)</td>
                        </tr>
                        <tr>
                            <td>Unduh / Unggah</td>
                            <td><script>
                            document.write(byte_nice($(bytes-out)) + ' / ' + byte_nice($(bytes-in)));
                            </script></td>
                        </tr>
                        <tr>
                            <td>Durasi Sesi</td>
                            <td><script>
                            document.write(secondsToTime($(uptime-secs)));
                            </script></td>
                        </tr>
                        <tr>
                            <td>Sisa Waktu</td>
                            <td><script>
                            document.write(secondsToTime($(session-time-left-secs)));
                            </script></td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Halaman ini muncul SETELAH logout berhasil diproses router,
                 jadi langsung sediakan jalan kembali ke login, bukan tombol Logout lagi. -->
            <div class="logout-actions">
                <a href="$(link-login)" class="btn btn-primary">Kembali ke Halaman Login</a>
            </div>
            <!-- <p>Dibuat oleh <a href="https://www.telkomsat.co.id/">Telkomsat</a></p> -->
        </main>

        <footer class="site-footer">
            <div class="site-footer-inner">
                <a href="https://www.telkomsat.co.id/" class="tsat-link"><img src="img/tsat.png" alt="Telkomsat" class="tsat-logo"></a>
                <span class="only-narrow">Bantuan <strong>1500832</strong></span>
                <span class="only-wide">Call Center <strong>1500832</strong> &middot; WhatsApp <strong>+62 811-9699-869</strong></span>
            </div>
        </footer>
    </div>

    <!-- Bootstrap core JavaScript
    ================================================== -->
    <!-- Placed at the end of the document so the pages load faster -->
    <script src="/js/jquery-1.12.2.min.js"></script>
    <script>
        window.jQuery || document.write('<script src="/js/jquery-1.12.2.min.js"><\/script>')
    </script>
    <script src="/js/bootstrap.min.js"></script>
</body>

</html>
