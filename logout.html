<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="">
    <meta name="author" content="">
    <title>WiFi BRITE | Logout</title>
    <link rel="icon" type="image/webp" sizes="32x32" href="img/brite-favicon-32.webp">
    <link rel="icon" type="image/webp" sizes="48x48" href="img/brite-favicon-48.webp">
    <link rel="apple-touch-icon" href="img/brite-touch-icon.png">
    <link rel="stylesheet" href="css/fallback.css?v=1">

    <!-- Cangkang tipis: bundle UI diambil dari server pusat (lihat login.html). -->
    <script src="/portal-config.js"></script>
    <script type="text/javascript">
        window.HS = {
            page: 'logout',
            linkLogin: '$(link-login)',
            linkLoginOnly: '$(link-login-only)',
            linkLogout: '$(link-logout)',
            linkStatus: '$(link-status)',
            linkOrig: '$(link-orig-esc)',
            mac: '$(mac)',
            ip: '$(ip)',
            locationId: '$(location-id)',
            username: ''
        };
    </script>
    <script type="text/javascript">
        (function () {
            var root = document.documentElement;

            // Tampilkan cadangan sekarang (aman dipanggil berulang).
            function showFallback() {
                if (!/\bhs-fallback-now\b/.test(root.className)) {
                    root.className += ' hs-fallback-now';
                }
            }

            var P = window.HS_PORTAL;
            if (!P || !P.assetBase) {
                showFallback();
                return;
            }
            var v = encodeURIComponent(P.version || '');
            var head = document.getElementsByTagName('head')[0];

            var css = document.createElement('link');
            css.rel = 'stylesheet';
            css.href = P.assetBase + 'app.css?v=' + v;
            css.onerror = showFallback;
            head.appendChild(css);

            var js = document.createElement('script');
            js.src = P.assetBase + 'app.js?v=' + v;
            js.onerror = showFallback;
            head.appendChild(js);

            // Pengaman: bila bundle belum mengambil alih dalam 3 detik.
            setTimeout(function () {
                if (!/\bhs-enhanced\b/.test(root.className)) {
                    showFallback();
                }
            }, 3000);
        })();
    </script>

    <script type="text/javascript">
        function byte_nice(bytes) {
            var s = ['bytes', 'KB', 'MB', 'GB', 'TB', 'PB'];
            bytes = bytes || 0;
            if (bytes == 0) {
                return 0 + " " + s[0];
            }
            var e = Math.floor(Math.log(bytes) / Math.log(1024));
            return (bytes / Math.pow(1024, Math.floor(e))).toFixed(2) + " " + s[e];
        }

        function pad2(n) {
            return (n < 10 ? '0' : '') + n;
        }

        function secondsToTime(e) {
            var h = Math.floor(e / 3600),
                m = Math.floor(e % 3600 / 60),
                s = Math.floor(e % 60);

            return pad2(h) + ':' + pad2(m) + ':' + pad2(s);
        }

        // MikroTik Hotspot bisa menyimpan cookie login (login-by "cookie") agar user
        // otomatis ter-autentikasi lagi tanpa masukin voucher. Setelah logout (manual
        // atau otomatis saat batal beli voucher), cookie ini harus dihapus supaya
        // sesi tidak tersambung sendiri lewat cookie yang masih tersisa.
        function clearHotspotCookies() {
            var cookies = document.cookie.split(';');
            for (var i = 0; i < cookies.length; i++) {
                var eqPos = cookies[i].indexOf('=');
                var name = (eqPos > -1 ? cookies[i].substr(0, eqPos) : cookies[i]).trim();
                if (!name) continue;
                document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/;';
            }
        }
    </script>
</head>

<body role="document">

    <!-- Wadah kosong untuk bundle UI. -->
    <div id="app"></div>

    <!-- Tampilan cadangan (lihat css/fallback.css). -->
    <div id="hs-fallback">
        <div class="fb-page">
            <div class="fb-card">
                <img src="img/brite-logo.webp" alt="BRITE by Telkomsat" class="fb-logo" width="560" height="234">

                <h1 class="fb-title">Anda sudah logout</h1>
                <p class="fb-lead">Ringkasan sesi terakhir Anda.</p>

                <!-- Ringkasan sesi yang baru berakhir. Angka mentah dari router
                     diformat oleh skrip di bawah (textContent). -->
                <div class="fb-rows">
                    <div class="fb-row">
                        <span class="fb-row-label">Durasi sesi</span>
                        <span class="fb-row-value" id="fb-uptime">$(uptime-secs)</span>
                    </div>
                    <div class="fb-row">
                        <span class="fb-row-label">Unduh / Unggah</span>
                        <span class="fb-row-value"><span id="fb-bytes-out">$(bytes-out)</span> / <span id="fb-bytes-in">$(bytes-in)</span></span>
                    </div>
                    <div class="fb-row">
                        <span class="fb-row-label">Sisa waktu</span>
                        <span class="fb-row-value" id="fb-time-left">$(session-time-left-secs)</span>
                    </div>
                </div>

                <!-- Halaman ini muncul SETELAH logout berhasil diproses router,
                     jadi langsung sediakan jalan kembali ke login. -->
                <div class="fb-actions">
                    <a href="$(link-login)" class="fb-btn fb-btn-primary">Kembali ke Halaman Login</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Teks dari router hanya dibaca lewat textContent, tidak pernah sebagai HTML. -->
    <div id="hs-username" hidden>$(username)</div>

    <script type="text/javascript">
        (function () {
            // Ganti angka mentah (string) dengan versi yang mudah dibaca;
            // kosong/bukan angka ditampilkan sebagai "-".
            function format(id, fn) {
                var el = document.getElementById(id);
                if (el) {
                    var n = parseFloat(el.textContent);
                    el.textContent = isNaN(n) ? '-' : fn(n);
                }
            }

            format('fb-uptime', secondsToTime);
            format('fb-bytes-out', byte_nice);
            format('fb-bytes-in', byte_nice);
            format('fb-time-left', secondsToTime);
        })();

        HS.username = (document.getElementById('hs-username') || {}).textContent || '';

        // Langsung dijalankan, tanpa menunggu event load: bundle yang disisipkan
        // dinamis menunda load, dan server yang menggantung bisa menahannya lama.
        clearHotspotCookies();
        location.replace('$(link-login)');
    </script>
</body>

</html>
