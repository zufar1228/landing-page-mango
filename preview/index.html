<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="MangoSphere Hotspot Login Preview">
    <meta name="author" content="Telkomsat">
    <title>MangoSphere | Login</title>
    <link rel="icon" type="image/x-icon" href="../img/hotspot.png">
    <link rel="stylesheet" href="css/style.css?v=12">
</head>
<body class="body-login-slr" role="document">
    <div id="pageTelkomsat" class="Telkomsat"><a href="#" class="Telkomsat-logo"></a></div>
    <div id="pageLogin" class="Login">
        <div class="mangosphere-logo"></div>
        <form name="login" id="formLogin" class="login-form-slr form">
            <div class="form-caption">Login</div>
            <p class="input-subcaption">Silahkan masukan kode voucher agar menikmati akses internet.</p>
            <input type="text" class="input-login" name="username" placeholder="Kode Voucher" aria-label="Kode Voucher" autocomplete="off">
            <input type="hidden" name="password">
            <input type="submit" class="submit-login" value="Login">
            <div id="input-voucher"><a href="#" id="btn-buy-vchr" class="submit-voucher">Beli Voucher Disini</a></div>
        </form>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
