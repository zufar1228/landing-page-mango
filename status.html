<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    $(if refresh-timeout)<meta http-equiv="refresh" content="$(refresh-timeout-secs)">$(endif)
    <meta name="description" content="">
    <meta name="author" content="">
    <title>WiFi BRITE | Status</title>
    <link rel="icon" type="image/webp" sizes="32x32" href="img/brite-favicon-32.webp">
    <link rel="icon" type="image/webp" sizes="48x48" href="img/brite-favicon-48.webp">
    <link rel="apple-touch-icon" href="img/brite-touch-icon.png">
    <link rel="stylesheet" href="css/fallback.css?v=1">

    <!-- Cangkang tipis: bundle UI diambil dari server pusat (lihat login.html). -->
    <script src="/portal-config.js"></script>
    <script type="text/javascript">
        window.HS = {
            page: 'status',
            linkLogin: '$(link-login)',
            linkLoginOnly: '$(link-login-only)',
            linkLogout: '$(link-logout)',
            linkStatus: '$(link-status)',
            linkOrig: '$(link-orig-esc)',
            mac: '$(mac)',
            ip: '$(ip)',
            locationId: '$(location-id)',
            username: '',
            bytesIn: '$(bytes-in)',
            bytesOut: '$(bytes-out)',
            uptimeSecs: '$(uptime-secs)',
            sessionTimeLeftSecs: '$(session-time-left-secs)',
            remainBytesTotal: '$(remain-bytes-total)'
        };
    </script>
    <script type="text/javascript">
        (function () {
            var P = window.HS_PORTAL;
            if (!P || !P.assetBase) {
                return;
            }
            var v = encodeURIComponent(P.version || '');
            var head = document.getElementsByTagName('head')[0];

            var css = document.createElement('link');
            css.rel = 'stylesheet';
            css.href = P.assetBase + 'app.css?v=' + v;
            head.appendChild(css);

            var js = document.createElement('script');
            js.src = P.assetBase + 'app.js?v=' + v;
            js.onerror = function () {
                document.documentElement.className += ' hs-fallback-now';
            };
            head.appendChild(js);
        })();
    </script>

    <!-- Auto-login dari link invoice: sesi sudah aktif, bersihkan state. -->
    <script type="text/javascript" src="/js/autologin.js"></script>
    <script type="text/javascript">
        if (window.BriteAutoLogin) {
            BriteAutoLogin.done();
        }
    </script>

    <script type="text/javascript">
        $(if advert-pending == 'yes')
        var popup = '';

        function focusAdvert() {
            if (window.focus) popup.focus();
        }

        function openAdvert() {
            popup = open('$(link-advert)', 'hotspot_advert', '');
            setTimeout("focusAdvert()", 1000);
        }
        $(endif)

        function byte_nice(bytes) {
            var s = ['bytes', 'KB', 'MB', 'GB', 'TB', 'PB'];
            bytes = bytes || 0;
            if (bytes == 0) {
                return 0 + " " + s[0];
            }
            var e = Math.floor(Math.log(bytes) / Math.log(1024));
            return (bytes / Math.pow(1024, Math.floor(e))).toFixed(2) + " " + s[e];
        }

        function pad2(n) {
            return (n < 10 ? '0' : '') + n;
        }

        function secondsToTime(e) {
            var h = Math.floor(e / 3600),
                m = Math.floor(e % 3600 / 60),
                s = Math.floor(e % 60);

            return pad2(h) + ':' + pad2(m) + ':' + pad2(s);
        }
    </script>
</head>

<body role="document" $(if advert-pending == 'yes') onLoad="openAdvert()" $(endif)>

    <!-- Wadah kosong untuk bundle UI. -->
    <div id="app"></div>

    <!-- Tampilan cadangan (lihat css/fallback.css). -->
    <div id="hs-fallback">
        <div class="fb-page">
            <div class="fb-card">
                <img src="img/brite-logo.webp" alt="BRITE by Telkomsat" class="fb-logo" width="560" height="234">

                <p class="fb-connected"><span class="fb-dot" aria-hidden="true"></span>Terhubung</p>
                <h1 class="fb-title">Status koneksi</h1>

                <!-- Sisa waktu & sisa kuota -->
                <div class="fb-stats">
                    <div class="fb-stat">
                        <span class="fb-stat-label">Sisa waktu</span>
                        <span class="fb-stat-value" id="fb-time-left"></span>
                    </div>
                    $(if remain-bytes-total)
                    <div class="fb-stat">
                        <span class="fb-stat-label">Sisa kuota</span>
                        <span class="fb-stat-value" id="fb-quota-left"></span>
                    </div>
                    $(endif)
                </div>

                <!-- Rincian sesi -->
                <div class="fb-rows">
                    <div class="fb-row">
                        <span class="fb-row-label">Unduh / Unggah</span>
                        <span class="fb-row-value" id="fb-traffic"></span>
                    </div>
                    <div class="fb-row">
                        <span class="fb-row-label">Durasi sesi</span>
                        <span class="fb-row-value" id="fb-uptime"></span>
                    </div>
                    <div class="fb-row">
                        <span class="fb-row-label">Alamat IP</span>
                        <span class="fb-row-value fb-mono">$(ip)</span>
                    </div>
                    <div class="fb-row">
                        <span class="fb-row-label">Alamat MAC</span>
                        <span class="fb-row-value fb-mono">$(mac)</span>
                    </div>
                </div>

                <div class="fb-actions">
                    <button type="button" class="fb-btn fb-btn-tinted" onclick="location.reload();">Muat Ulang</button>
                    <form action="$(link-logout)" name="logout">
                        <input type="hidden" name="erase-cookie" value="on">
                        <input type="submit" value="Logout" class="fb-btn fb-btn-danger">
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Teks dari router hanya dibaca lewat textContent, tidak pernah sebagai HTML. -->
    <div id="hs-username" hidden>$(username)</div>

    <script type="text/javascript">
        (function () {
            function put(id, value) {
                var el = document.getElementById(id);
                if (el) {
                    el.textContent = value;
                }
            }

            // Nilai HS berupa string; kosong/bukan angka ditampilkan sebagai "-".
            function fmt(fn, value) {
                var n = parseFloat(value);
                return isNaN(n) ? '-' : fn(n);
            }

            put('fb-time-left', fmt(secondsToTime, HS.sessionTimeLeftSecs));
            put('fb-quota-left', fmt(byte_nice, HS.remainBytesTotal));
            put('fb-traffic', fmt(byte_nice, HS.bytesOut) + ' / ' + fmt(byte_nice, HS.bytesIn));
            put('fb-uptime', fmt(secondsToTime, HS.uptimeSecs));
        })();

        HS.username = (document.getElementById('hs-username') || {}).textContent || '';
    </script>
</body>

</html>
