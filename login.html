<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Login WiFi BRITE by Telkomsat">
    <meta name="author" content="Telkomsat">
    <title>WiFi BRITE | Login</title>
    <link rel="icon" type="image/webp" sizes="32x32" href="img/brite-favicon-32.webp">
    <link rel="icon" type="image/webp" sizes="48x48" href="img/brite-favicon-48.webp">
    <link rel="apple-touch-icon" href="img/brite-touch-icon.png">
    <link rel="stylesheet" href="css/fallback.css?v=1">

    <!-- Cangkang tipis: bundle UI (app.css + app.js) diambil dari server pusat
         lewat alamat di /portal-config.js. Bila gagal, form cadangan di bawah
         tampil dan tetap bisa login tanpa JavaScript eksternal. -->
    <script src="/portal-config.js"></script>
    <script type="text/javascript">
        window.HS = {
            page: 'login',
            linkLogin: '$(link-login)',
            linkLoginOnly: '$(link-login-only)',
            linkLogout: '$(link-logout)',
            linkStatus: '$(link-status)',
            linkOrig: '$(link-orig-esc)',
            mac: '$(mac)',
            ip: '$(ip)',
            locationId: '$(location-id)',
            username: '',
            chapId: '$(chap-id)',
            chapChallenge: '$(chap-challenge)'
        };
    </script>
    <script type="text/javascript">
        (function () {
            var root = document.documentElement;

            // Tampilkan cadangan sekarang (aman dipanggil berulang).
            function showFallback() {
                if (!/\bhs-fallback-now\b/.test(root.className)) {
                    root.className += ' hs-fallback-now';
                }
            }

            var P = window.HS_PORTAL;
            if (!P || !P.assetBase) {
                showFallback();
                return;
            }
            var v = encodeURIComponent(P.version || '');
            var head = document.getElementsByTagName('head')[0];

            var css = document.createElement('link');
            css.rel = 'stylesheet';
            css.href = P.assetBase + 'app.css?v=' + v;
            css.onerror = showFallback;
            head.appendChild(css);

            var js = document.createElement('script');
            js.src = P.assetBase + 'app.js?v=' + v;
            js.onerror = showFallback;
            head.appendChild(js);

            // Pengaman: bila bundle belum mengambil alih dalam 3 detik.
            setTimeout(function () {
                if (!/\bhs-enhanced\b/.test(root.className)) {
                    showFallback();
                }
            }, 3000);
        })();
    </script>
</head>

<body role="document">

    <!-- Wadah kosong untuk bundle UI. -->
    <div id="app"></div>

    <!-- =====================================================
         TAMPILAN CADANGAN
         =====================================================
         Tampil otomatis bila bundle tidak mengambil alih #app
         (lihat css/fallback.css). -->
    <div id="hs-fallback">
        <div class="fb-page">
            <div class="fb-card">
                <img src="img/brite-logo.webp" alt="BRITE by Telkomsat" class="fb-logo" width="560" height="234">

                <h1 class="fb-title">Masuk ke WiFi BRITE</h1>
                <p class="fb-lead">Masukkan kode voucher Anda.</p>

                <div id="hs-err-msg" class="fb-alert" role="alert" hidden></div>
                <p id="hs-status" class="fb-note" hidden></p>

                <form name="login" id="formLogin" class="login-form" action="$(link-login-only)" method="post" $(if chap-id) onSubmit="return doLogin()" $(endif)>
                    <input type="hidden" name="dst" value="$(link-orig)">
                    <input type="hidden" name="popup" value="true">

                    <label for="username" class="fb-sr">Kode Voucher</label>
                    <input type="text" id="username" class="fb-input input-voucher" name="username" placeholder="Kode voucher">

                    <input type="hidden" class="input-login" name="password">

                    <input type="submit" class="fb-btn fb-btn-primary" value="Masuk">
                </form>

                <div id="hs-buy-divider" class="fb-divider" hidden>Belum punya voucher?</div>
                <a id="hs-buy" class="fb-btn fb-btn-tinted" target="_blank" rel="noopener" hidden>Beli Voucher</a>
            </div>
        </div>
    </div>

    <!-- Teks dari router hanya dibaca lewat textContent, tidak pernah sebagai HTML. -->
    <div id="hs-error" hidden>$(error)</div>
    <div id="hs-username" hidden>$(username)</div>

    <!-- =====================================================
         MIKROTIK CHAP FORM
         ===================================================== -->
    $(if chap-id)
    <form name="sendin" action="$(link-login-only)" method="post">
        <input type="hidden" name="username">
        <input type="hidden" name="password">
        <input type="hidden" name="dst" value="$(link-orig)">
        <input type="hidden" name="popup" value="true">
    </form>

    <script type="text/javascript" src="/md5.js"></script>
    $(endif)

    <!-- =====================================================
         LOGIN FUNCTION
         ===================================================== -->
    <script type="text/javascript">
        function doLogin() {
            var username = document.login.username.value;
            var password = document.login.password.value;

            if (password === '') {
                password = username;
            }

            $(if chap-id)
            document.sendin.username.value = username;
            document.sendin.password.value = hexMD5(
                '$(chap-id)' +
                password +
                '$(chap-challenge)'
            );
            document.sendin.submit();
            return false;
            $(else)
            document.login.password.value = password;
            return true;
            $(endif)
        }
    </script>

    <!-- =====================================================
         SKRIP CADANGAN: PESAN ERROR, ISI USERNAME, LINK BELI
         ===================================================== -->
    <script type="text/javascript">
        (function () {
            function text(id) {
                var el = document.getElementById(id);
                return el ? (el.textContent || '').replace(/^\s+|\s+$/g, '') : '';
            }

            // Terjemahan pesan error router (pola tidak boleh diubah).
            var error_msg = text('hs-error');
            var matched;

            if ((matched = error_msg.match(/Sorry... you have used all your data allowance/))) {
                error_msg = "Maaf, kuota Anda sudah habis";
            } else if ((matched = error_msg.match(/Sorry... you have used your (.*?) data allowance/))) {
                error_msg = "Maaf, kuota Anda sudah habis";
            } else if ((matched = error_msg.match(/Maximum usage exceeded/))) {
                error_msg = "Maaf, waktu Anda sudah habis";
            } else if ((matched = error_msg.match(/Maximum (.*?) usage exceeded/))) {
                error_msg = "Maaf, waktu Anda sudah habis";
            } else if ((matched = error_msg.match(/The time for voucher (.*?) is depleted/))) {
                error_msg = "Maaf, waktu Anda sudah habis";
            } else if ((matched = error_msg.match(/You are already logged in/))) {
                error_msg = "Anda sudah login";
            } else if ((matched = error_msg.match(/Account disabled/))) {
                error_msg = "Voucher dinonaktifkan";
            } else if ((matched = error_msg.match(/Unknown user/))) {
                error_msg = "Voucher tidak diketahui";
            } else if ((matched = error_msg.match(/Simultaneous connections limited to (\d+)/))) {
                error_msg = "Voucher hanya bisa digunakan di " + matched[1] + " perangkat dalam waktu bersamaan";
            } else if ((matched = error_msg.match(/User (.*?) not registered/))) {
                error_msg = "Voucher tidak terdaftar";
            }

            var box = document.getElementById('hs-err-msg');
            if (error_msg && box) {
                box.textContent = error_msg;
                box.removeAttribute('hidden');
            }

            // Isi ulang kolom voucher dengan yang terakhir dikirim ke router.
            var field = document.login.username;
            if (field && !field.value) {
                field.value = text('hs-username');
            }

            // Link Beli Voucher cadangan. Nilai cmac adalah mac-esc dari router
            // apa adanya (sudah ter-escape), jadi TIDAK di-encode lagi.
            var P = window.HS_PORTAL;
            var buy = document.getElementById('hs-buy');
            if (buy && P && P.serverBase) {
                buy.href = P.serverBase + 'hotspot/embed/voucher/buy/' +
                    encodeURIComponent(HS.locationId) +
                    '?cmac=' + '$(mac-esc)' +
                    '&return_url=' + 'http%3A%2F%2Ftsat.zone%2Flogin';
                buy.removeAttribute('hidden');
                document.getElementById('hs-buy-divider').removeAttribute('hidden');
            }
        })();
    </script>

    <!-- =====================================================
         AUTO-LOGIN DARI LINK: /login?voucher=KODE
         =====================================================
         Dipakai tombol "sambungkan" di halaman invoice pembayaran. Logika
         ada di js/autologin.js. Kode dikirim lewat form login cadangan
         (doLogin + CHAP). Parameter sengaja bernama "voucher", bukan
         "username": MikroTik sendiri memproses /login?username=... sebelum
         halaman ini. -->
    <script type="text/javascript" src="/js/autologin.js"></script>
    <script type="text/javascript">
        (function () {
            if (window.BriteAutoLogin && BriteAutoLogin.onLoginPage(document.login)) {
                // Sinyal untuk bundle: login otomatis sedang berjalan.
                HS.autoLogin = true;
                document.documentElement.className += ' hs-autologin';

                var st = document.getElementById('hs-status');
                if (st) {
                    st.textContent = 'Menyambungkan ke WiFi BRITE. Kode voucher Anda sedang diproses, mohon tunggu sebentar.';
                    st.removeAttribute('hidden');
                }
            }
        })();
    </script>

    <script type="text/javascript">
        HS.username = (document.getElementById('hs-username') || {}).textContent || '';
    </script>
</body>

</html>
