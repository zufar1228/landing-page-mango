<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- The above meta tags *must* come first in the head; any other head content must come *after* these tags -->
    <meta name="description" content="Pemberitahuan WiFi BRITE by Telkomsat">
    <meta name="author" content="Telkomsat">
    <title>WiFi BRITE | Terjadi Kesalahan</title>
    <link rel="icon" type="image/x-icon" href="img/hotspot.png">
    <link rel="stylesheet" href="css/style.css">
</head>

<body role="document">
    <div class="page page-center page-error">
        <header class="site-header">
            <img src="img/brite-logo.png" alt="BRITE by Telkomsat" class="brand-logo">
            <a href="https://www.telkomsat.co.id/" class="tsat-link only-wide"><img src="img/tsat.png" alt="Telkomsat" class="tsat-logo"></a>
        </header>

        <main class="page-main">
            <section class="error-card" aria-labelledby="error-title">
                <div class="error-icon" aria-hidden="true">!</div>
                <h1 class="error-title" id="error-title">Terjadi Kesalahan</h1>
                <p class="error-text">Layanan sedang mengalami gangguan sementara. Tunggu sebentar, lalu coba lagi.</p>
                <p class="error-code">Pesan sistem: $(error)</p>
                <div class="error-actions">
                    <a href="$(link-login)" class="btn btn-primary">Kembali ke Halaman Login</a>
                </div>
            </section>
        </main>

        <footer class="site-footer">
            <div class="site-footer-inner">
                <p class="footer-note">Masih bermasalah? Hubungi Call Center <strong>1500832</strong></p>
            </div>
        </footer>
    </div>
</body>

</html>
