<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- The above meta tags *must* come first in the head; any other head content must come *after* these tags -->
    <meta name="description" content="Pemberitahuan WiFi BRITE by Telkomsat">
    <meta name="author" content="Telkomsat">
    <title>WiFi BRITE | Terjadi Kesalahan</title>
    <link rel="icon" type="image/webp" sizes="32x32" href="img/brite-favicon-32.webp">
    <link rel="icon" type="image/webp" sizes="48x48" href="img/brite-favicon-48.webp">
    <link rel="apple-touch-icon" href="img/brite-touch-icon.png">
    <link rel="stylesheet" href="css/fallback.css?v=1">

    <!-- Cangkang tipis: bundle UI diambil dari server pusat (lihat login.html). -->
    <script src="/portal-config.js"></script>
    <script type="text/javascript">
        window.HS = {
            page: 'error',
            linkLogin: '$(link-login)',
            linkLoginOnly: '$(link-login-only)',
            linkLogout: '$(link-logout)',
            linkStatus: '$(link-status)',
            linkOrig: '$(link-orig-esc)',
            mac: '$(mac)',
            ip: '$(ip)',
            locationId: '$(location-id)',
            username: ''
        };
    </script>
    <script type="text/javascript">
        (function () {
            var root = document.documentElement;

            // Tampilkan cadangan sekarang (aman dipanggil berulang).
            function showFallback() {
                if (!/\bhs-fallback-now\b/.test(root.className)) {
                    root.className += ' hs-fallback-now';
                }
            }

            var P = window.HS_PORTAL;
            if (!P || !P.assetBase) {
                showFallback();
                return;
            }
            var v = encodeURIComponent(P.version || '');
            var head = document.getElementsByTagName('head')[0];

            var css = document.createElement('link');
            css.rel = 'stylesheet';
            css.href = P.assetBase + 'app.css?v=' + v;
            css.onerror = showFallback;
            head.appendChild(css);

            var js = document.createElement('script');
            js.src = P.assetBase + 'app.js?v=' + v;
            js.onerror = showFallback;
            head.appendChild(js);

            // Pengaman: bila bundle belum mengambil alih dalam 3 detik.
            setTimeout(function () {
                if (!/\bhs-enhanced\b/.test(root.className)) {
                    showFallback();
                }
            }, 3000);
        })();
    </script>
</head>

<body role="document">

    <!-- Wadah kosong untuk bundle UI. -->
    <div id="app"></div>

    <!-- Tampilan cadangan (lihat css/fallback.css). Teks generik selalu
         tampil; kode error router disalin ke #hs-err-msg oleh skrip di bawah. -->
    <div id="hs-fallback">
        <div class="fb-page">
            <div class="fb-card">
                <img src="img/brite-logo.webp" alt="BRITE by Telkomsat" class="fb-logo" width="560" height="234">

                <h1 class="fb-title">Tidak dapat terhubung ke server</h1>
                <p class="fb-lead">Layanan sedang mengalami gangguan sementara. Tunggu sebentar, lalu coba lagi.</p>
                <p id="hs-err-line" class="fb-code" hidden>Kode: <span id="hs-err-msg"></span></p>
                <noscript><p class="fb-code">Kode: $(error)</p></noscript>

                <div class="fb-actions">
                    <button type="button" class="fb-btn fb-btn-primary" onclick="location.reload()">Coba Lagi</button>
                    <a href="$(link-login)" class="fb-btn fb-btn-tinted">Kembali ke Login</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Teks dari router hanya dibaca lewat textContent, tidak pernah sebagai HTML. -->
    <div id="hs-error" hidden>$(error)</div>
    <div id="hs-username" hidden>$(username)</div>

    <script type="text/javascript">
        (function () {
            var src = document.getElementById('hs-error');
            var msg = src ? (src.textContent || '').replace(/^\s+|\s+$/g, '') : '';
            var out = document.getElementById('hs-err-msg');
            var line = document.getElementById('hs-err-line');
            if (msg && out && line) {
                out.textContent = msg;
                line.removeAttribute('hidden');
            }
        })();

        HS.username = (document.getElementById('hs-username') || {}).textContent || '';
    </script>
</body>

</html>
